<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Analytics — Shabi Israel</title>
    <link rel="icon" type="image/png" href="assets/favicon-round.png">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/typography-tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/theme-picker.css">
    <link rel="stylesheet" href="css/tabs.css">
    <!-- subtabs.css carries the shared neutral pill (.subtab--pill.pill-neutral)
         used by mountFilterToggle — the "Exclude my own traffic" control. -->
    <link rel="stylesheet" href="css/subtabs.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="table-lab/formats/mf/mf.css">
    <!-- Canonical combobox dropdown + mobile search-sheet styling (.app-combo-*,
         .search-sheet-*, .sf-badge). This page loads neither navigation.css nor
         the site sidebar, so without this the all-clicks smart-search renders
         unstyled — its mobile sheet loses the flex row that right-aligns the
         count badge, gluing the number to the label. admin.html loads this same
         file for the same reason. -->
    <link rel="stylesheet" href="css/search-overlay.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/typography-overrides.css">

    <link rel="preload" href="assets/logo/logo.png" as="image" fetchpriority="high">
    <!-- The splash's own JS, preloaded — otherwise it is only discovered after
         this page's renderer module has downloaded AND parsed, and the ring
         would still be empty on a slow connection. -->
    <link rel="modulepreload" href="js/utils/splash.js">
    <link rel="modulepreload" href="js/utils/splashConfig.js">
    <link rel="stylesheet" href="css/splash.css">
    <!-- GENERATED from assets/splash/splash-config.json by scripts/build-splash-css.js.
         Must stay here, in <head>: it carries the saved splash design as
         --sp-*-cfg custom properties, so the loading screen is correct on its
         FIRST paint. Without it the splash renders css/splash.css's fallback
         design and then restyles itself when the JSON lands ~330ms later. -->
    <link rel="stylesheet" href="assets/splash/splash-vars.css">
    <noscript><style>#logo-splash{display:none}</style></noscript>

    <script>
      (function(){
        var t=localStorage.getItem('shabi-theme');
        if(t==='modern')t='nature';if(t==='royal')t='vegas';if(t&&t!=='current'){document.documentElement.dataset.theme=t;localStorage.setItem('shabi-theme',t);}
        var c=localStorage.getItem('shabi-custom-vars');
        if(c){try{var v=JSON.parse(c);for(var k in v)document.documentElement.style.setProperty(k,v[k])}catch(e){}}
        // Fail-safe: the splash is static markup, so a module that never loads
        // would leave it covering the page forever. Take it away regardless.
        setTimeout(function(){var s=document.getElementById('logo-splash');if(s&&!s.dataset.done){s.remove();document.documentElement.classList.remove('sp-active');}},25000);
        // Don't flash the splash on a fast internal navigation — see index.html.
        try {
          if (document.referrer && document.referrer.indexOf(location.origin + '/') === 0) {
            var DEFER = 350, de = document.documentElement;
            de.classList.add('sp-defer');
            window.__splashRevealAt = performance.now() + DEFER;
            var reveal = function () {
              de.classList.remove('sp-defer');
              // The real reveal moment, so the minimum-display clock and the
              // "was it ever actually seen?" test in splash.js use the truth.
              window.__splashRevealAt = performance.now();
            };
            var timer = setTimeout(reveal, DEFER);
            // A cross-document view transition shows a STILL PHOTO of each page
            // and cross-fades them. Anything caught in that photo is frozen, so
            // a splash inside it looks dead, then gets replaced by the live one
            // — which reads as the splash appearing twice. Hold it back until
            // the transition is over and the live document is on screen.
            window.addEventListener('pagereveal', function (e) {
              if (e && e.viewTransition) {
                clearTimeout(timer);
                e.viewTransition.finished.then(reveal, reveal);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <!-- Full-screen loading screen. Static on purpose: this is the FIRST paint,
         so it must not wait for a deferred module. data-stages picks the
         analytics stage list (SPLASH_STAGE_SETS) — this page runs two RPCs over
         a month window, not the site's league/ranking load. -->
    <div class="splash" id="logo-splash" data-stages="analytics" role="status" aria-live="polite">
        <div class="splash-core">
            <div class="sp-copy">
                <p class="sp-eyebrow"><span></span><em>Shabi Israel</em></p>
                <p class="sp-stage">Connecting to the database</p>
                <p class="sp-detail">Step 1 of 6 · 0%</p>
            </div>
            <div class="sp-ring" data-mode="determinate">
                <div class="sp-logo"><img src="assets/logo/logo.png" alt=""></div>
            </div>
            <!-- Chips are STATIC so the row is there in the first paint. Built by
                 JS they appeared ~1s late and pushed the layout, which read as the
                 splash reloading. Must match SPLASH_STAGE_SETS[data-stages]; if they
                 drift, buildSteps() rewrites them. -->
            <ul class="sp-steps">
                <li><span class="dot"></span>Connect</li>
                <li><span class="dot"></span>Access</li>
                <li><span class="dot"></span>Months</li>
                <li><span class="dot"></span>Activity</li>
                <li><span class="dot"></span>Details</li>
                <li><span class="dot"></span>Report</li>
            </ul>
            <script>
              /* Build the ring here, not in splash.js: an ES module only runs
                 once its whole import graph has downloaded, which is far too
                 late for the first paint. See index.html for the measurement. */
              (function () {
                var r = document.currentScript.parentNode.querySelector('.sp-ring'),
                    f = document.createDocumentFragment(),
                    N = parseInt(getComputedStyle(r).getPropertyValue('--n'), 10) || 24;
                for (var i = 0; i < N; i++) {
                  var d = document.createElement('div');
                  d.className = 'sq';
                  d.style.setProperty('--i', i);
                  d.style.setProperty('--a', (i * 360 / N) + 'deg');
                  f.appendChild(d);
                }
                r.insertBefore(f, r.firstChild);
              })();
            </script>
            <p class="sp-slow">Taking longer than usual — the connection looks slow.
                <button type="button">Retry</button></p>
        </div>
    </div>
    <!-- Wake the splash NOW, not when the page renderer's import graph finally
         resolves. splash.js is reached through that renderer, and an ES module
         only EXECUTES once its WHOLE graph has downloaded and parsed: measured
         at 2404ms on this page, against a splash that becomes visible at 350ms.
         For those 2 seconds the loading screen sat on screen frozen — unlit
         ring, no step chips, "0%" — and then visibly came alive, which reads as
         the screen loading a second time. This import has a graph of two tiny
         preloaded files, so it runs at DOMContentLoaded instead. -->
    <script type="module">import './js/utils/splash.js';</script>
    <div class="page-container" id="main" role="main">
        <!-- Empty on purpose, exactly like league.html / player.html: the
             splash is the only loading UI, so nothing here paints until there
             is real content. Both halves used to ship filled in — a hardcoded
             <h1> and a "Loading analytics…" line — which showed straight
             through the transparent splash as a second loading message.
             renderAnalyticsPage() writes the title. -->
        <div class="page-header">
            <h1 id="page-title"></h1>
        </div>
        <div id="content"></div>
    </div>
    <script type="module">
        import { renderAnalyticsPage } from './js/render/analyticsPage.js';
        import { applyThemeBootstrap, initThemePicker } from './js/render/themePicker.js';

        applyThemeBootstrap();
        initThemePicker();
        renderAnalyticsPage();
    </script>
</body>
</html>
