    <!-- The splash's own JS, preloaded. Without this it is discovered only
         after the page's big renderer module has downloaded AND parsed (it is
         the renderer that imports it), so on a slow connection the loading
         screen appeared with an empty ring — measured: still no squares after
         4s at 150KB/s. These two are tiny; fetching them up front costs
         nothing and is what makes the splash useful when it actually matters. -->
    <link rel="modulepreload" href="js/utils/splash.js">
    <link rel="modulepreload" href="js/utils/splashConfig.js">
    <link rel="stylesheet" href="css/splash.css">
    <!-- GENERATED from assets/splash/splash-config.json by scripts/build-splash-css.js.
         Must stay here, in <head>: it carries the saved splash design as
         --sp-*-cfg custom properties, so the loading screen is correct on its
         FIRST paint. Without it the splash renders css/splash.css's fallback
         design and then restyles itself when the JSON lands ~330ms later. -->
    <link rel="stylesheet" href="assets/splash/splash-vars.css">
    <noscript><style>#logo-splash{display:none}</style></noscript>

    <!-- Self-hosted Bebas Neue. This page never carried a fonts.googleapis.com
         <link>, but its hero banner can use the family, and heroBanner.js no
         longer requests it from Google — so the face has to be declared here. -->
    <link rel="stylesheet" href="css/fonts.css">
    <script>
      (function(){
        var t=localStorage.getItem('shabi-theme');
        if(t==='modern')t='nature';if(t==='royal')t='vegas';if(t&&t!=='current'){document.documentElement.dataset.theme=t;localStorage.setItem('shabi-theme',t);}
        var c=localStorage.getItem('shabi-custom-vars');
        if(c){try{var v=JSON.parse(c);for(var k in v)document.documentElement.style.setProperty(k,v[k])}catch(e){}}
        // Fail-safe: the splash is static markup, so a module that never loads
        // would leave it covering the page forever. Take it away regardless.
        setTimeout(function(){var s=document.getElementById('logo-splash');if(s&&!s.dataset.done){s.remove();document.documentElement.classList.remove('sp-active');}},25000);
        // Don't flash the splash on a fast internal navigation. Arriving from
        // our own site means the View Transition is still showing the previous
        // page, so hold the splash back briefly; if the data lands first it is
        // never seen at all. A direct hit or reload has nothing behind it, so
        // it shows at once. splash.js reads __splashRevealAt to know whether
        // it was ever actually on screen.
        try {
          // ── Is there anything to load at all? ────────────────────────────
          // The loading screen exists to cover a wait. On an internal
          // navigation the whole dataset is already in localStorage, so there
          // is no request to wait for and no wait to cover; a loading screen
          // over a page with nothing to load is pure added latency. The old
          // rule here was a stopwatch — "wait 350ms, show if the page isn't
          // done" — which made it a coin toss decided by device speed: the
          // same transition showed nothing on a fast machine and a full
          // ~1s splash (defer + minimum-display + ring-close + fade) on a
          // slow one.
          //
          // So: if js/data/store.js left a valid receipt, the data is already
          // here and the splash is suppressed outright. Infinity makes every
          // "was it ever seen?" test in splash.js answer no, so endSplash()
          // removes it with no minimum-display, no ring-close and no fade.
          //
          // If the page turns out to need the network after all (receipt
          // present but bundle evicted), store.js fires
          // shabi:bundle-fetch-start and splash.js arms it then — see
          // armSplashForFetch(). This mirrors store.js's RECEIPT_KEY rule by
          // hand, because a <head> script cannot import;
          // scripts/check-splash-arming.mjs fails if the two drift apart.
          var SP_SCHEMA = 1, SP_MAX_AGE = 604800000, DEFER = 350;
          var de = document.documentElement, spWarm = false;
          try {
            var rcpt = JSON.parse(localStorage.getItem('shabi:bundle:receipt') || 'null');
            spWarm = !!rcpt && rcpt.schemaVersion === SP_SCHEMA
              && typeof rcpt.fetchedAt === 'number'
              && (Date.now() - rcpt.fetchedAt) <= SP_MAX_AGE;
          } catch (e) {}
          if (spWarm) {
            de.classList.add('sp-defer');
            window.__splashSuppress = true;
            window.__splashRevealAt = Infinity;
          } else if (document.referrer && document.referrer.indexOf(location.origin + '/') === 0) {
            de.classList.add('sp-defer');
            window.__splashRevealAt = performance.now() + DEFER;
            var reveal = function () {
              de.classList.remove('sp-defer');
              // The real reveal moment, so the minimum-display clock and the
              // "was it ever actually seen?" test in splash.js use the truth.
              window.__splashRevealAt = performance.now();
            };
            var timer = setTimeout(reveal, DEFER);
            // A cross-document view transition shows a STILL PHOTO of each page
            // and cross-fades them. Anything caught in that photo is frozen, so
            // a splash inside it looks dead, then gets replaced by the live one
            // — which reads as the splash appearing twice. Hold it back until
            // the transition is over and the live document is on screen.
            window.addEventListener('pagereveal', function (e) {
              if (e && e.viewTransition) {
                clearTimeout(timer);
                e.viewTransition.finished.then(reveal, reveal);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <!-- Full-screen loading screen. Static on purpose: this is the FIRST
         paint, so it must not wait for a deferred module. js/utils/splash.js
         only fills the ring and takes it away. On this page it also covers the
         hero banner's own shimmer, which keeps running underneath as the
         no-splash fallback. -->
    <div class="splash" id="logo-splash" role="status" aria-live="polite">
        <div class="splash-core">
            <div class="sp-copy">
                <p class="sp-eyebrow"><span></span><em>Shabi Israel</em></p>
                <p class="sp-stage">Connecting to the database</p>
                <p class="sp-detail">Step 1 of 6 · 0%</p>
            </div>
            <div class="sp-ring" data-mode="determinate">
                <div class="sp-logo"><img src="assets/logo/logo.png" alt=""></div>
            </div>
            <!-- Chips are STATIC so the row is there in the first paint. Built by
                 JS they appeared ~1s late and pushed the layout, which read as the
                 splash reloading. Must match SPLASH_STAGE_SETS[data-stages]; if they
                 drift, buildSteps() rewrites them. -->
            <ul class="sp-steps">
                <li><span class="dot"></span>Connect</li>
                <li><span class="dot"></span>Settings</li>
                <li><span class="dot"></span>Matches</li>
                <li><span class="dot"></span>Players</li>
                <li><span class="dot"></span>Ranking</li>
                <li><span class="dot"></span>Render</li>
            </ul>
            <script>
              /* Build the ring here, not in splash.js. An ES module only
                 EXECUTES once its whole import graph has downloaded, and
                 splash.js is reached via the page's renderer — which pulls in
                 dozens of files. Measured at 150KB/s: still no squares after
                 4 seconds, i.e. the ring was missing exactly when the loading
                 screen mattered most. A classic inline script runs during
                 parsing, so the ring is there in the first paint.
                 splash.js only rebuilds it if the saved config wants a
                 different count. */
              (function () {
                var r = document.currentScript.parentNode.querySelector('.sp-ring'),
                    f = document.createDocumentFragment(),
                    /* --n comes from assets/splash/splash-vars.css, a blocking
                       stylesheet in <head>, so the SAVED square count is already
                       known here and the first paint has the right ring. The 24
                       is only a fallback for that generated file going missing. */
                    N = parseInt(getComputedStyle(r).getPropertyValue('--n'), 10) || 24;
                for (var i = 0; i < N; i++) {
                  var d = document.createElement('div');
                  d.className = 'sq';
                  d.style.setProperty('--i', i);
                  d.style.setProperty('--a', (i * 360 / N) + 'deg');
                  f.appendChild(d);
                }
                r.insertBefore(f, r.firstChild);
              })();
            </script>
            <p class="sp-slow">Taking longer than usual — the connection looks slow.
                <button type="button">Retry</button></p>
        </div>
    </div>
    <!-- Wake the splash NOW, not when the page renderer's import graph finally
         resolves. splash.js is reached through that renderer, and an ES module
         only EXECUTES once its WHOLE graph has downloaded and parsed: measured
         at 2404ms on this page, against a splash that becomes visible at 350ms.
         For those 2 seconds the loading screen sat on screen frozen — unlit
         ring, no step chips, "0%" — and then visibly came alive, which reads as
         the screen loading a second time. This import has a graph of two tiny
         preloaded files, so it runs at DOMContentLoaded instead. -->
    <script type="module">import './js/utils/splash.js';</script>
    <div class="page-container" id="main" role="main">
        <!-- Hero banner is injected here by applyHeroBanner(); starts hidden so
             nothing paints before it. -->
        <div class="page-header" id="page-header" style="visibility:hidden"></div>
        <div id="content"></div>
    </div>
    <script src="vendor/html2canvas-pro.min.js"></script>
    <script type="module">
        import { isPreviewMode, installPreviewInterceptor } from './js/admin/previewMode.js';
        import { hasUrlFlag } from './js/utils/queryString.js';
        if (isPreviewMode()) installPreviewInterceptor();

        import { renderLandingPage } from './js/render/landingPage.js';
        import { onVisibleRevalidate } from './js/data/store.js';
        import { applyThemeBootstrap } from './js/render/themePicker.js';
        import { initNavBar, initKeyboardShortcuts } from './js/render/navigation.js';
        import { mountSiteSidebar } from './js/render/siteSidebar.js';
        import { isLoggedIn } from './js/admin/auth.js';

        applyThemeBootstrap();
        await initNavBar();

        // Admin edit mode mounts the admin sidebar from inside landingPage.js;
        // skip the public sidebar in that case so we don't get two sidebars.
        const isAdminEdit = isLoggedIn() && !isPreviewMode() && hasUrlFlag('edit');
        if (!isAdminEdit) mountSiteSidebar({ activeView: 'home', topbarTitle: 'Home' });

        renderLandingPage();
        // Self-heal / passive refresh: on return-to-visible or bfcache restore,
        // re-render only if the data changed or a failed load can now succeed.
        onVisibleRevalidate(renderLandingPage);
        initKeyboardShortcuts();
    </script>
    <script type="module" src="js/analytics.js"></script>
</body>
