<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Same policy as the quiz's other pages: nothing off-origin except the
         app's own Supabase backend. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://oaowwbwssfsohaskrgnc.supabase.co wss://oaowwbwssfsohaskrgnc.supabase.co http://127.0.0.1:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Analytics — GevKahoot</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/favicon-round.png">
    <!-- The main site's analytics look: its tokens, tabs, sections, cards and
         tables (the page is the GevKahoot twin of shabi-israel/analytics.html). -->
    <link rel="stylesheet" href="../shabi-israel/css/fonts.css">
    <link rel="stylesheet" href="../shabi-israel/css/variables.css">
    <link rel="stylesheet" href="../shabi-israel/css/typography-tokens.css">
    <link rel="stylesheet" href="../shabi-israel/css/layout.css">
    <link rel="stylesheet" href="../shabi-israel/css/components.css">
    <link rel="stylesheet" href="../shabi-israel/css/theme.css">
    <link rel="stylesheet" href="../shabi-israel/css/themes.css">
    <link rel="stylesheet" href="../shabi-israel/css/theme-picker.css">
    <link rel="stylesheet" href="../shabi-israel/css/tabs.css">
    <link rel="stylesheet" href="../shabi-israel/css/subtabs.css">
    <link rel="stylesheet" href="../shabi-israel/css/sections.css">
    <link rel="stylesheet" href="../shabi-israel/css/dashboard.css">
    <link rel="stylesheet" href="../shabi-israel/css/admin.css">
    <link rel="stylesheet" href="../shabi-israel/table-lab/formats/mf/mf.css">
    <link rel="stylesheet" href="../shabi-israel/css/analytics.css">
    <link rel="stylesheet" href="css/analytics.css">
    <!-- The main site's loading screen, as on its analytics page: its CSS and
         its SAVED design (generated splash-vars.css), so the first paint is
         already the right screen. -->
    <link rel="stylesheet" href="../shabi-israel/css/splash.css">
    <link rel="stylesheet" href="../shabi-israel/assets/splash/splash-vars.css">
    <link rel="preload" href="assets/logo/mark.svg" as="image">
    <!-- Theme before the first paint, the ring, the fail-safe (see the file). -->
    <script src="analytics-boot.js"></script>
</head>
<body>
    <!-- Full-screen loading screen — the same markup as
         shabi-israel/analytics.html, with GevKahoot's name and logo.
         data-stages picks this page's stage list (SPLASH_STAGE_SETS in
         shabi-israel/js/utils/splashConfig.js); the chips are static so the row
         is there in the first paint, and must match it. The ring's squares
         come from analytics-boot.js. -->
    <div class="splash" id="logo-splash" data-stages="gk-analytics" data-config="../shabi-israel/assets/splash/splash-config.json" role="status" aria-live="polite">
        <div class="splash-core">
            <div class="sp-copy">
                <p class="sp-eyebrow"><span></span><em>GevKahoot</em></p>
                <p class="sp-stage">Connecting to the database</p>
                <p class="sp-detail">Step 1 of 6 · 0%</p>
            </div>
            <div class="sp-ring" data-mode="determinate">
                <div class="sp-logo"><img src="assets/logo/mark.svg" alt=""></div>
            </div>
            <ul class="sp-steps">
                <li><span class="dot"></span>Connect</li>
                <li><span class="dot"></span>Access</li>
                <li><span class="dot"></span>Months</li>
                <li><span class="dot"></span>Activity</li>
                <li><span class="dot"></span>Live</li>
                <li><span class="dot"></span>Report</li>
            </ul>
            <p class="sp-slow">Taking longer than usual — the connection looks slow.
                <button type="button">Retry</button></p>
        </div>
    </div>
    <script type="module" src="js/gkAnalyticsSplash.js"></script>
    <div class="page-container" id="main" role="main">
        <!-- Empty on purpose, as on the main site: the splash is the only
             loading UI, and anything here would show through it. The title is
             written with the report (gkAnalytics.js). -->
        <div class="page-header">
            <h1 id="page-title" class="analytics-title"></h1>
        </div>
        <div id="content"></div>
    </div>
    <script type="module" src="js/gkAnalytics.js"></script>
</body>
</html>
