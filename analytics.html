<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Analytics — Shabi Israel</title>
    <link rel="icon" type="image/png" href="assets/favicon-round.png">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/typography-tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/theme-picker.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="table-lab/formats/mf/mf.css">
    <!-- Canonical combobox dropdown + mobile search-sheet styling (.app-combo-*,
         .search-sheet-*, .sf-badge). This page loads neither navigation.css nor
         the site sidebar, so without this the all-clicks smart-search renders
         unstyled — its mobile sheet loses the flex row that right-aligns the
         count badge, gluing the number to the label. admin.html loads this same
         file for the same reason. -->
    <link rel="stylesheet" href="css/search-overlay.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/typography-overrides.css">

    <script>
      (function(){
        var t=localStorage.getItem('shabi-theme');
        if(t==='modern')t='nature';if(t==='royal')t='vegas';if(t&&t!=='current'){document.documentElement.dataset.theme=t;localStorage.setItem('shabi-theme',t);}
        var c=localStorage.getItem('shabi-custom-vars');
        if(c){try{var v=JSON.parse(c);for(var k in v)document.documentElement.style.setProperty(k,v[k])}catch(e){}}
      })();
    </script>
</head>
<body>
    <div class="page-container" id="main" role="main">
        <div class="page-header">
            <h1>Analytics</h1>
        </div>
        <div id="content">
            <div class="loading">Loading analytics...</div>
        </div>
    </div>
    <script type="module">
        import { renderAnalyticsPage } from './js/render/analyticsPage.js';
        import { applyThemeBootstrap, initThemePicker } from './js/render/themePicker.js';

        applyThemeBootstrap();
        initThemePicker();
        renderAnalyticsPage();
    </script>
</body>
</html>
