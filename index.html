<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>golan.me.uk</title>
    <meta name="description" content="Projects hosted at golan.me.uk">

    <!-- Root landing page for the domain. Each project lives in its own folder,
         so a new project = a new folder here (see CLAUDE.md § Hosting layout).
         Deliberately dependency-free: no shared CSS, no fonts, no build step —
         this page must render even if every project below is mid-deploy. -->
    <link rel="icon" href="shabi-israel/assets/favicon-round.png">

    <style>
        :root {
            color-scheme: light dark;
            --bg: #faf8f4;
            --panel: #fff;
            --ink: #1b1813;
            --muted: #6b6357;
            --line: #e6e0d6;
            --accent: #8a6d3b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15120e;
                --panel: #1e1a15;
                --ink: #f0ebe3;
                --muted: #9a9184;
                --line: #2e2820;
                --accent: #c9a86a;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { width: 100%; max-width: 34rem; }
        h1 {
            margin: 0 0 .25rem;
            font-size: 1.5rem;
            letter-spacing: -0.01em;
        }
        .sub { margin: 0 0 2rem; color: var(--muted); font-size: .95rem; }
        ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
        a.card {
            display: flex;
            align-items: center;
            gap: .9rem;
            padding: 1rem 1.15rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: .75rem;
            text-decoration: none;
            color: inherit;
            transition: border-color .15s ease, transform .15s ease;
        }
        a.card:hover, a.card:focus-visible {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .card img { width: 40px; height: 40px; border-radius: 50%; flex: none; }
        .card-name { font-weight: 600; }
        .card-desc { color: var(--muted); font-size: .875rem; }
        .notice {
            margin: 1.75rem 0 0;
            padding: .9rem 1.1rem;
            border-left: 3px solid var(--accent);
            background: var(--panel);
            border-radius: 0 .5rem .5rem 0;
            color: var(--muted);
            font-size: .875rem;
        }
        .notice strong { color: var(--ink); font-weight: 600; word-break: break-word; }
    </style>
</head>
<body>
    <main>
        <h1>golan.me.uk</h1>
        <p class="sub">Projects hosted on this domain.</p>

        <ul>
            <li>
                <a class="card" href="shabi-israel/">
                    <img src="shabi-israel/assets/favicon-round.png" alt="">
                    <span>
                        <span class="card-name">Shabi Israel</span><br>
                        <span class="card-desc">Backgammon leagues — rankings &amp; statistics</span>
                    </span>
                </a>
            </li>
        </ul>

        <p class="notice">
            Shabi Israel is now at
            <strong>golan.me.uk/shabi-israel</strong>.
            Old links still work, but please save the new address — it is the
            site's address from now on.
        </p>
    </main>
</body>
</html>
